name: a-share-quant-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a_share_quant_lab}
      POSTGRES_USER: ${POSTGRES_USER:-a_share_quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://a_share_quant:change-me-for-local-use@postgres:5432/a_share_quant_lab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKTEST_REPOSITORY: ${BACKTEST_REPOSITORY:-sql}
      BACKTEST_MARKET_DATA: ${BACKTEST_MARKET_DATA:-fixture}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fixture}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://a_share_quant:change-me-for-local-use@postgres:5432/a_share_quant_lab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fixture}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://a_share_quant:change-me-for-local-use@postgres:5432/a_share_quant_lab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fixture}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /app/frontend
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
